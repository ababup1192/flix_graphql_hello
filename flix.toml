[package]
name        = "flix_graphql_hello"
description = "Flix と PostgreSQL の headless CMS。GraphQL は graphql-java、DB は sqlfx"
version     = "0.1.0"
flix        = "0.75.3"
authors     = ["abab <ababup1192@gmail.com>"]

[dependencies]
# sqlfx 本体（Db / Q.Fragment / Time / Uuid）。生成器と migrate の CLI は入っていないので flix_db 側の main で動かす。
# WhyNot: security を unrestricted にするのは、sqlfx が pgjdbc と HikariCP を Maven 依存として持ち、Java を呼ぶ依存は
# 利用側が明示的に許可しないと Flix が読まないため（既定の plain は Java interop を禁じる）
"github:ababup1192/sqlfx" = { version = "0.3.1", security = "unrestricted" }

[mvn-dependencies]
"com.graphql-java:graphql-java" = "22.3"
# scalar JSON の実装（Coercing）。Flix で Java の interface を書くより既製の物を配線する
"com.graphql-java:graphql-java-extended-scalars" = "22.0"
"org.xerial:sqlite-jdbc" = "3.46.1.0"
"org.postgresql:postgresql" = "42.7.4"
"com.zaxxer:HikariCP" = "5.1.0"
# WhyNot: HikariCP は SLF4J で書くので、束縛が無いと最初の利用時に警告を標準エラーへ出し、Flix のテストが失敗扱いになる
"org.slf4j:slf4j-nop" = "1.7.36"
