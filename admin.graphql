"""任意の JSON 値。entry の中身（フィールドの apiId → 値）に使う"""
scalar JSON

"""管理 API。content type とフィールドの定義と、entry を読み書きする。形は固定で、コンテンツ API は定義から実行時に組む"""
type Query {
  """全 content type。apiId 順"""
  contentTypes: [ContentType!]!
  """id か apiId で 1 つ。無ければ null"""
  contentType(id: ID, apiId: String): ContentType
  """型の entry の一覧。既定は更新が新しい順。search は下書きの中身に含む文字列。where / orderBy はコンテンツ API と同じ意味で、
  after は前のページの pageInfo.endCursor（orderBy と対。skip とは同時に渡せない）"""
  entries(typeId: ID!, search: String, where: EntryWhere, orderBy: [EntryOrderBy!], first: Int = 50, skip: Int = 0, after: String): EntryPage!
  """entry 1 つ。無ければ null"""
  entry(id: ID!): Entry
  """asset の一覧。新しい順。アップロード途中（PENDING）の物も出る。after は前のページの pageInfo.endCursor（skip とは同時に渡せない）"""
  assets(first: Int = 50, skip: Int = 0, after: String): AssetPage!
  """asset 1 つ。無ければ null"""
  asset(id: ID!): Asset
  """公開できるか。書き込まない。violations が空なら publishEntry は通る（unique は押した瞬間の競合を除く）"""
  publishCheck(id: ID!): PublishReport!
  """操作の影響。取り下げ・削除で壊れる参照元と、公開で一緒に動く参照先"""
  impact(id: ID!, action: ImpactAction!): Impact!
  """複数の entry をまとめて dry-run し、公開する順（参照先が先）を返す。書き込まない。
  withDependencies なら未公開の参照先も計画に入る（reason: DEPENDENCY）。ok なら publishMany は同じ順で通る"""
  publishPlan(ids: [ID!]!, withDependencies: Boolean = true): PublishPlan!
  """今の身元（API キー / PAT / ログイン）と、できる事。何者としてこの API を叩いているかを確かめる"""
  viewer: Viewer!

  """自分。ログインしていなければ null。organizations と projects は自分が触れる物だけ"""
  me: Me
  """今のプロジェクトのメンバー（owner だけ）"""
  members: [Member!]!
  """今のプロジェクトの招待（owner だけ）"""
  invitations: [Invitation!]!
  """今のプロジェクトの API キー（owner だけ）。生の鍵は出ない"""
  apiKeys: [ApiKey!]!
  """今のプロジェクトの Webhook（owner だけ）。secret は出ない"""
  webhooks: [Webhook!]!
  """Webhook の配信の記録。新しい順（owner だけ）。after は前のページの最後の id（id は時刻順なので、その id より古い物が続く）"""
  webhookDeliveries(webhookId: ID!, first: Int = 20, after: ID): [WebhookDelivery!]!
  """予約公開の一覧。新しい順。entryId を渡せばその entry の物だけ。after は前のページの最後の id"""
  schedules(entryId: ID, first: Int = 50, after: ID): [Schedule!]!
  """監査の記録。新しい順（owner だけ）。誰が・いつ・何を変えたか。after は前のページの最後の id。
  絞り込みは全部任意: actorKind は主体の種類、action は前方一致（"webhook." で Webhook の全部）、
  since / until は ISO 8601 の時刻（since 以上 until 未満。id が時刻順なので id の範囲で引く）"""
  auditEvents(first: Int = 50, after: ID, actorKind: ActorKind, action: String, since: String, until: String): [AuditEvent!]!
  """auditEvents と同じ絞り込みでの件数（owner だけ）。一覧の下に出す件数と、書き出しの前の上限（100,000 件）の確認に"""
  auditEventsCount(actorKind: ActorKind, action: String, since: String, until: String): Int!
  """スキーマを変える前の影響。書き込まない。safe なら確認なしで押せる。
  押す時は effects から組んだ expected を渡す（渡さずに押すと、影響がある操作は止まる）"""
  fieldImpact(input: SchemaChangeInput!): SchemaImpact!
  """richText の linkCard の OGP を表から引く（取りに行かない）。編集画面が開き直した時に。表に無い url は落ちる"""
  linkCards(urls: [String!]!): [LinkCard!]!
}

"""入力の 1 つの誤り。path は GraphQL の入力に対応（"fields.title" など）"""
type Violation {
  path: String!
  message: String!
}

"""公開の検査結果（dry-run）"""
type PublishReport {
  ok: Boolean!
  """required / unique / 参照の消失 / asset の未完了。全部一度に"""
  violations: [Violation!]!
  """未公開の参照先。withDependencies: true で一緒に公開できる"""
  unpublishedDependencies: [Entry!]!
}

enum ImpactAction {
  PUBLISH
  UNPUBLISH
  DELETE
}

"""この entry を参照している 1 つ"""
type Referrer {
  entry: Entry!
  """参照しているフィールドの apiId。本文内のリンクなら RICH_TEXT のフィールド"""
  via: String!
  """参照している側のどの中身か"""
  stage: ContentStage!
}

"""中身の段階"""
enum ContentStage {
  DRAFT
  PUBLISHED
}

"""公開計画の entry が計画に入った理由"""
enum PlanReason {
  """ids で渡した物"""
  REQUESTED
  """withDependencies で足した未公開の参照先"""
  DEPENDENCY
}

"""公開計画の 1 手"""
type PublishPlanStep {
  entry: Entry!
  reason: PlanReason!
  """この entry だけの dry-run"""
  report: PublishReport!
}

"""公開計画（dry-run）。steps の順に publishMany が公開する"""
type PublishPlan {
  """steps の report が全部 ok で、violations も空"""
  ok: Boolean!
  """公開する順。参照先が先"""
  steps: [PublishPlanStep!]!
  """計画そのものの違反。参照の循環と、withDependencies: false の時の計画の外の未公開の参照先。steps の report の違反は含まない"""
  violations: [Violation!]!
}

"""スキーマを変える操作。action ごとに要る項目が違う"""
input SchemaChangeInput {
  action: SchemaAction!
  """REMOVE_FIELD / UPDATE_FIELD のフィールド"""
  fieldId: ID
  """ADD_FIELD / DELETE_CONTENT_TYPE の型"""
  typeId: ID
  """UPDATE_FIELD の変更"""
  patch: FieldPatch
  """ADD_FIELD の定義"""
  field: FieldInput
}

enum SchemaAction {
  REMOVE_FIELD
  UPDATE_FIELD
  ADD_FIELD
  DELETE_CONTENT_TYPE
}

"""スキーマを変えると既存のデータに何が起きるか"""
enum SchemaEffectKind {
  """値が配信から消える。DB には残る"""
  VALUES_HIDDEN
  """参照が配信から消える"""
  REFERENCES_HIDDEN
  """asset の参照が配信から消える"""
  ASSETS_HIDDEN
  """消したはずの値が配信に戻る"""
  VALUES_RESURRECTED
  """公開中の entry が再公開できなくなる"""
  PUBLISH_BLOCKED
  """下書きの保存が通らなくなる"""
  DRAFT_BLOCKED
  """型と一緒に entry が消える"""
  ENTRIES_REMOVED
}

"""影響 1 つ"""
type SchemaEffect {
  kind: SchemaEffectKind!
  """効くフィールドの apiId。型ごとの影響なら null"""
  field: String
  """下書きに当たる件数"""
  draft: Int!
  """公開中に当たる件数"""
  published: Int!
  """当たる entry の見本。先頭 5 件（更新の新しい順）。残りは draft / published から引く"""
  entries: [Entry!]!
}

"""スキーマを変える前の影響（dry-run）"""
type SchemaImpact {
  """既存のデータに何も起きない。確認なしで押せる"""
  safe: Boolean!
  effects: [SchemaEffect!]!
}

"""画面が見た影響。押す時に渡す。見た時より種類が増えるか公開中の件数が増えていれば止まる"""
input SchemaImpactInput {
  kinds: [SchemaEffectKind!]!
  published: Int!
}

"""操作の影響"""
type Impact {
  """壊れる（参照先を失う）entry。取り下げ・削除の前に見せる"""
  breaks: [Referrer!]!
  """一緒に動く entry。公開なら先に公開される未公開の参照先"""
  cascades: [Entry!]!
}

type Mutation {
  createContentType(input: ContentTypeInput!): ContentType!
  updateContentType(id: ID!, input: ContentTypePatch!): ContentType!
  """フィールドごと消す。expected は fieldImpact で見た影響"""
  deleteContentType(id: ID!, expected: SchemaImpactInput): ID!
  """末尾に足す。消した apiId で足し直すと残った値が配信に戻るので、その時は expected が要る"""
  addField(typeId: ID!, input: FieldInput!, expected: SchemaImpactInput): FieldDef!
  """expected は fieldImpact で見た影響"""
  updateField(id: ID!, input: FieldPatch!, expected: SchemaImpactInput): FieldDef!
  """expected は fieldImpact で見た影響"""
  removeField(id: ID!, expected: SchemaImpactInput): ID!
  """ids の順に並べ直す。型の全フィールドを過不足なく渡す"""
  reorderFields(typeId: ID!, ids: [ID!]!): ContentType!

  """下書きを作る。id を渡せば（移行用）それを使い、無ければ振る。fields は apiId → 値"""
  createEntry(typeId: ID!, fields: JSON!, id: ID): Entry!
  """下書きを直す。fields のキーだけ上書きし、null で消す。expectedVersion が今の version と違えば CONFLICT"""
  updateEntry(id: ID!, fields: JSON!, expectedVersion: Int!): Entry!
  """ゴミ箱へ（soft delete）。公開中なら公開も取り下げる"""
  deleteEntry(id: ID!): ID!
  """下書きを公開する。required と unique と参照先の公開はここで検査する。公開中なら公開側を下書きで上書きする。
  withDependencies なら未公開の参照先を先に公開する"""
  publishEntry(id: ID!, withDependencies: Boolean = false): Entry!
  """publishPlan と同じ計画を作り、ok ならその順で 1 つの Tx で全部公開する。1 つでも通らなければ何も公開せず INVALID
  （violations の path は "b1.fields.title" のように entry id が頭に付く）。返すのは公開した順の entry"""
  publishMany(ids: [ID!]!, withDependencies: Boolean = true): [Entry!]!
  """公開を取り下げる。下書きは残る"""
  unpublishEntry(id: ID!): Entry!
  """今の下書きをバージョンとして残す"""
  saveVersion(id: ID!): EntryVersion!
  """バージョンの中身を下書きに戻す。expectedVersion は updateEntry と同じ"""
  restoreVersion(id: ID!, versionId: ID!, expectedVersion: Int!): Entry!

  """asset の置き先（署名付き PUT URL）を発行する。ブラウザが Content-Type / Content-Length を宣言どおりにして PUT し、
  終わったら confirmAsset を呼ぶ。URL は expiresInSeconds で切れる"""
  createUploadUrl(input: UploadInput!): Upload!
  """置いた事をストレージで確かめて READY にする。画像なら寸法を渡す。置かれていなければエラー"""
  confirmAsset(id: ID!, input: AssetConfirmInput): Asset!
  """alt を変える。ファイルの差し替えは新しい asset を作る"""
  updateAsset(id: ID!, input: AssetPatch!): Asset!
  """消す。entry（下書き・公開・richText の画像を含む）が使っていればエラー"""
  deleteAsset(id: ID!): ID!

  """プレビュートークンを発行する（readDraft を持つ人）。X-Preview-Token で渡すと、その entry と参照先の下書きをコンテンツ API で読める。
  既定 1 時間、最長 1 日。url は型の previewUrl の {id} を置き換えて ?preview=<token> を付けた物（previewUrl が無ければ null）"""
  createPreviewToken(entryId: ID!, expiresInSeconds: Int = 3600): PreviewToken!

  """時刻を指定して公開する（publishEntries を持つ人）。at は ISO 8601。同じ entry の未実行の公開の予約は置き換わる。
  時刻が来たら通常の publishEntry と同じ検査で公開し、通らなければ FAILED に理由が残る"""
  schedulePublish(entryId: ID!, at: String!, withDependencies: Boolean = false): Schedule!
  """時刻を指定して取り下げる"""
  scheduleUnpublish(entryId: ID!, at: String!): Schedule!
  """未実行の予約を取り消す"""
  cancelSchedule(id: ID!): Schedule!

  """今のプロジェクトの公開範囲（owner だけ）"""
  updateProjectVisibility(visibility: Visibility!): Project!
  """email で招待する（owner だけ）。既にログインした事のある人はその場でメンバーになり、
  まだの人は招待として置かれて初回ログインで役割が付く"""
  inviteMember(email: String!, role: Role!): Invitation!
  cancelInvitation(id: ID!): ID!
  """役割を変える（owner だけ）。最後の owner は降格できない"""
  changeMemberRole(userId: ID!, role: Role!): Member!
  """外す（owner だけ）。最後の owner は外せない"""
  removeMember(userId: ID!): ID!
  """API キーを発行する（owner だけ）。key はこの応答でしか見えない。scope が WRITE なら role が必須（自分の役割より高くはできない）、
  それ以外で role を渡すとエラー。expiresAt（ISO 8601）を渡すとその時刻で切れる。無ければ期限無し"""
  createApiKey(name: String!, scope: ApiKeyScope!, role: Role, expiresAt: String): IssuedApiKey!
  """失効する（owner だけ）"""
  revokeApiKey(id: ID!): ID!

  """Webhook を作る（owner だけ）。secret はこの応答でしか見えない"""
  createWebhook(input: WebhookInput!): IssuedWebhook!
  """Webhook を直す（owner だけ）。secret は変わらない"""
  updateWebhook(id: ID!, input: WebhookInput!): Webhook!
  """Webhook を消す。配信の記録も消える（owner だけ）"""
  deleteWebhook(id: ID!): ID!
  """配信をもう 1 度送る（owner だけ）。failed や delivered の物にも使える"""
  redeliverWebhook(deliveryId: ID!): WebhookDelivery!

  """監査の記録を書き出した事を監査に積む（owner だけ）。GET /admin/audit.csv / audit.jsonl が書き出しの最後に呼ぶ。
  action は audit.exported、detail に format と絞り込み（auditEvents と同じ引数）と件数"""
  recordAuditExport(input: AuditExportInput!): Boolean!

  """richText の linkCard の OGP を取る（writeEntries を持つ人）。編集画面が URL を貼った瞬間に呼ぶ。
  表に 7 日以内の物があれば取りに行かずそれを返す。取れなければ error に理由（bot 拒否 / 404 / OGP なし / タイムアウト）が入り、
  title 以下は null。http(s) 以外とプライベートアドレスは取りに行かず error だけ返す（表にも残らない）"""
  fetchLinkCard(url: String!): LinkCard!
}

"""richText の linkCard の OGP 1 つ。公開の HTML の `<a data-link-card>` の中身はこれで組む"""
type LinkCard {
  url: String!
  """og:title、無ければ <title>。取れなかった時は null"""
  title: String
  """og:description を 200 字で切った物"""
  description: String
  """og:image（相手の URL のまま）"""
  imageUrl: String
  siteName: String
  """取りに行った時刻（ISO 8601）。成功も失敗も更新する"""
  fetchedAt: String!
  """取れなかった理由。取れていれば null"""
  error: String
}

enum ScheduleAction {
  PUBLISH
  UNPUBLISH
}

enum ScheduleStatus {
  """時刻を待っている"""
  PENDING
  """実行中"""
  RUNNING
  DONE
  """実行したが通らなかった。lastError に理由"""
  FAILED
  CANCELLED
}

"""予約公開 1 つ。id は時刻順（ULID）"""
type Schedule {
  id: ID!
  entryId: ID!
  action: ScheduleAction!
  runAt: String!
  withDependencies: Boolean!
  status: ScheduleStatus!
  requestedBy: String!
  lastError: String!
  """runAt が既に過ぎている（次の tick ですぐ実行される）。管理画面が「過去の時刻です」と出すため"""
  overdue: Boolean!
  createdAt: String!
  doneAt: String
}

"""下書きを公開前のサイトで見るためのトークン"""
type PreviewToken {
  token: String!
  entryId: ID!
  expiresAt: String!
  """管理画面が開くプレビューの URL。型に previewUrl が無ければ null"""
  url: String
}

"""Webhook が知らせる出来事"""
enum WebhookEvent {
  """entry を公開した（再公開も）"""
  ENTRY_PUBLISHED
  """公開を取り下げた"""
  ENTRY_UNPUBLISHED
  """entry をゴミ箱へ入れた"""
  ENTRY_DELETED
  """content type かフィールドが変わった"""
  SCHEMA_CHANGED
}

"""配信 1 回の状態"""
enum DeliveryStatus {
  """送る番を待っている（再試行待ちも）"""
  PENDING
  """送っている最中"""
  SENDING
  """2xx が返った"""
  DELIVERED
  """回数を使い切った。redeliverWebhook で送り直せる"""
  FAILED
}

input WebhookInput {
  name: String!
  """POST 先。http:// か https://"""
  url: String!
  events: [WebhookEvent!]!
  active: Boolean = true
}

"""登録した Webhook。受け手は X-Cms-Signature（sha256=HMAC(secret, "timestamp.body")）で照合する"""
type Webhook {
  id: ID!
  name: String!
  url: String!
  events: [WebhookEvent!]!
  active: Boolean!
  createdAt: String!
}

type IssuedWebhook {
  webhook: Webhook!
  """HMAC の鍵。この応答でしか見えない"""
  secret: String!
}

"""配信の記録 1 つ。id は時刻順（ULID）"""
type WebhookDelivery {
  id: ID!
  event: WebhookEvent!
  status: DeliveryStatus!
  """送った回数"""
  attempts: Int!
  nextAttemptAt: String!
  """最後の HTTP のステータス。応答が無ければ 0"""
  lastStatus: Int!
  lastError: String!
  createdAt: String!
  deliveredAt: String
}

"""プロジェクトでの役割。上が下を含む"""
enum Role {
  VIEWER
  WRITER
  EDITOR
  OWNER
}

"""組織での役割。OWNER は組織の全プロジェクトの owner でもある"""
enum OrgRole {
  MEMBER
  OWNER
}

"""API キーの範囲"""
enum ApiKeyScope {
  """公開中の中身"""
  READ
  """下書きも"""
  READ_DRAFT
  """管理 API を role の範囲で叩ける（CI やスクリプト用）。メンバー・鍵・プロジェクトの管理はできない"""
  WRITE
}

"""プロジェクトの見え方"""
enum Visibility {
  """公開中の中身はキー無しで読める"""
  PUBLIC
  """read のキーが要る"""
  PRIVATE
}

"""自分"""
type Me {
  id: ID!
  email: String!
  name: String!
  """今のプロジェクトでの役割（無ければ空）と、できる事"""
  roles: [Role!]!
  permissions: [String!]!
  organizations: [OrganizationMembership!]!
  projects: [ProjectMembership!]!
}

"""今の身元の種類"""
enum ViewerKind {
  """ログインの JWT で来た人"""
  USER
  """Personal Access Token で来た人"""
  PERSONAL_TOKEN
  """プロジェクトの API キー"""
  API_KEY
  """プレビュートークン"""
  PREVIEW
  """身元無し"""
  ANONYMOUS
  """サーバ自身（内部の処理）"""
  SYSTEM
}

"""今の身元。名前・役割・scope と、できる事"""
type Viewer {
  kind: ViewerKind!
  """人なら email、鍵なら鍵の名前。無ければ空"""
  name: String!
  """役割。人は今のプロジェクトでの役割（read の PAT は viewer に落ちる）、WRITE の鍵はその role。無ければ空"""
  roles: [Role!]!
  """鍵か PAT の scope（read / readDraft / write）。それ以外は null"""
  scope: String
  """できる事（readDraft / writeEntries / publishEntries / manageTypes / manageAssets / manageMembers / manageApiKeys / manageProject のうち通る物）"""
  permissions: [String!]!
}

type Organization {
  id: ID!
  name: String!
}

type OrganizationMembership {
  organization: Organization!
  role: OrgRole!
}

type Project {
  id: ID!
  slug: String!
  name: String!
  visibility: Visibility!
}

type ProjectMembership {
  project: Project!
  role: Role!
}

type Member {
  userId: ID!
  email: String!
  name: String!
  role: Role!
}

type Invitation {
  id: ID!
  email: String!
  role: Role!
  createdAt: String!
}

"""監査の主体の種類"""
enum ActorKind {
  """ログインした人"""
  USER
  """プロジェクトの API キー"""
  API_KEY
  """PAT で来た人"""
  PAT
  """サーバ自身（予約公開の実行）"""
  SYSTEM
}

"""監査の書き出しの形式"""
enum AuditExportFormat {
  """UTF-8 with BOM、1 行 1 件、detail は JSON の文字列を 1 セルに"""
  CSV
  """JSON Lines。1 行 1 件、detail は入れ子のまま"""
  JSON
}

"""書き出した事の記録。絞り込みは auditEvents と同じ引数（渡した物だけ detail に残る）、count は書き出した件数"""
input AuditExportInput {
  format: AuditExportFormat!
  actorKind: ActorKind
  action: String
  since: String
  until: String
  count: Int!
}

"""監査の 1 件。版の残らない変更（メンバー・役割・鍵・型・Webhook・asset・公開範囲と、entry の取り下げ・削除・予約公開の実行）を積んだ物。
entry の編集と手での公開は entry_versions に版として残るので、ここには出ない"""
type AuditEvent {
  id: ID!
  """主体の種類"""
  actorKind: ActorKind!
  """主体の id。人は users.public_id（Member.userId と同じ物）、鍵は鍵の名前、SYSTEM は空。actorKind の列を足す前の行も空"""
  actorId: String!
  """した人の表示名。人は email、鍵は "api-key:<鍵の名前>"（版の author と同じ形）"""
  actor: String!
  """した事。"member.role_changed" / "type.deleted" / "webhook.deleted" / "entry.unpublished" など"""
  action: String!
  """対象の種類。"member" / "invitation" / "api_key" / "type" / "field" / "project" / "webhook" / "webhook_delivery" / "asset" / "entry" / "audit"（書き出し） """
  targetKind: String!
  """対象。型は apiId、フィールドは "<型の apiId>.<フィールドの apiId>"、メンバーは id か email、Webhook・asset・entry は id、プロジェクトは slug"""
  targetId: String!
  """付随する値。役割の変更なら {"role": "editor"}、消した物は {"before": 変更前の姿}（Webhook の url は host / pathHint / urlHash に落とした物）、
  entry なら {"typeApiId", "version"}"""
  detail: JSON!
  """UTC の ISO 8601"""
  createdAt: String!
}

type ApiKey {
  id: ID!
  name: String!
  """鍵の末尾 4 文字。.env に入れた鍵と一覧の行を突き合わせるための目印。古い鍵は空"""
  keyHint: String!
  scope: ApiKeyScope!
  """WRITE の鍵の役割。それ以外は null"""
  role: Role
  createdAt: String!
  """期限。無ければ null"""
  expiresAt: String
  """最後に管理 API で使った時刻（1 分の粒度）。公開 API の読み取りでは更新しない"""
  lastUsedAt: String
  revokedAt: String
}

"""発行した鍵。key はこの時だけ"""
type IssuedApiKey {
  id: ID!
  name: String!
  scope: ApiKeyScope!
  role: Role
  expiresAt: String
  key: String!
}

"""asset の状態"""
enum AssetStatus {
  """URL を出したが、まだ置かれた事を確かめていない"""
  PENDING
  """置かれ、confirmAsset が確かめた"""
  READY
}

"""画像やファイル。中身はストレージにあり、url で配信する"""
type Asset {
  id: ID!
  """配信 URL"""
  url: String!
  fileName: String!
  mime: String!
  """バイト数"""
  size: Int!
  """画像の幅。画像でなければ null"""
  width: Int
  height: Int
  alt: String!
  status: AssetStatus!
  createdAt: String!
  """この asset を使っている entry（下書き・公開・本文の image）"""
  usedBy: [Entry!]!
}

"""asset の一覧の 1 ページ。nodes か edges のどちらかを読む。次のページは pageInfo.endCursor を after に渡す"""
type AssetPage {
  nodes: [Asset!]!
  edges: [AssetEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type AssetEdge {
  """この asset の位置。after に渡せる"""
  cursor: String!
  node: Asset!
}

"""ページの続き。hasNextPage なら endCursor を after に渡して次を読む"""
type PageInfo {
  hasNextPage: Boolean!
  """このページの最後の位置。空のページなら null"""
  endCursor: String
}

"""署名付き URL の発行結果"""
type Upload {
  asset: Asset!
  """ここへ PUT する"""
  uploadUrl: String!
  """URL の有効期限（秒）"""
  expiresInSeconds: Int!
}

input UploadInput {
  fileName: String!
  """image/png などの許可リストにある物"""
  mime: String!
  """バイト数。画像は 20 MB、動画は 200 MB まで"""
  size: Int!
}

input AssetConfirmInput {
  width: Int
  height: Int
  alt: String
}

input AssetPatch {
  alt: String!
}

"""entry の状態"""
enum EntryStage {
  """まだ公開していない"""
  DRAFT
  """公開中で、下書きは公開した物と同じ"""
  PUBLISHED
  """公開中で、公開後に下書きが進んでいる（再公開で反映）"""
  CHANGED
}

"""entry。fields は下書きの中身"""
type Entry {
  id: ID!
  typeId: ID!
  """楽観ロックのバージョン番号。updateEntry に expectedVersion として渡す"""
  version: Int!
  stage: EntryStage!
  fields: JSON!
  publishedAt: String
  createdAt: String!
  updatedAt: String!
  """サイト上でのこの entry の path。型の linkPath（"/blog/{slug}"）から作る。linkPath が無い型は null。
  本文からこの entry を指した時に出る href と同じ物"""
  path: String
  """バージョン。新しい順。公開時と saveVersion で積む"""
  versions: [EntryVersion!]!
  """2 つのバージョンの中身の差分。from → to の向き。同じなら空。定義の position 順で、定義に無いキーは最後"""
  diff(from: VersionRef!, to: VersionRef!): [FieldChange!]!
}

"""どのバージョンか。versionId か stage のどちらか 1 つ（両方・両方無しは INVALID）。DRAFT は今の下書き、PUBLISHED は公開中の中身（未公開なら空。初回公開の diff は全部 ADDED）"""
input VersionRef {
  versionId: ID
  stage: ContentStage
}

"""フィールド（か配列の 1 要素）の変わり方"""
enum ChangeKind {
  """to にだけある"""
  ADDED
  """from にだけある"""
  REMOVED
  """値が違う（OBJECT がオブジェクトでなくなった時や BLOCKS の variant が変わった時も）"""
  CHANGED
  """OBJECT / BLOCKS / 配列の中で違う。children に中身"""
  NESTED
  """RICH_TEXT の Markdown の行差分。lines に中身"""
  TEXT
}

"""1 つの差分。path は "hero.headline" / "tags[2]" / "sections[0].headline" の形"""
type FieldChange {
  path: String!
  kind: ChangeKind!
  """from 側の値。ADDED と NESTED と TEXT では null"""
  before: JSON
  """to 側の値。REMOVED と NESTED と TEXT では null"""
  after: JSON
  """NESTED の中身。それ以外は null"""
  children: [FieldChange!]
  """TEXT の行。それ以外は null"""
  lines: [DiffLine!]
}

"""行差分の 1 行"""
enum LineKind {
  """両方にある"""
  SAME
  """to にだけある"""
  ADD
  """from にだけある"""
  DEL
}

type DiffLine {
  kind: LineKind!
  text: String!
}

"""バージョンを積んだ理由"""
enum VersionReason {
  PUBLISH
  SAVE
}

"""entry のバージョン"""
type EntryVersion {
  id: ID!
  """積んだ時点の entry の version"""
  version: Int!
  reason: VersionReason!
  author: String!
  fields: JSON!
  createdAt: String!
}

"""entry の一覧の 1 ページ。nodes か edges のどちらかを読む。次のページは pageInfo.endCursor を after に渡す"""
type EntryPage {
  nodes: [Entry!]!
  edges: [EntryEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type EntryEdge {
  """この entry の位置。after に渡せる"""
  cursor: String!
  node: Entry!
}

"""entries の絞り込み。全部に合う物（AND）"""
input EntryWhere {
  """公開中か下書きか（CHANGED は公開中に含む）"""
  stage: ContentStage
  id_in: [ID!]
  """フィールドの値の条件。コンテンツ API の <Singular>Where の葉（title_contains など）と同じ意味を apiId と op で書く"""
  fields: [EntryFieldCondition!]
  """作った時刻（entries の列）で絞る"""
  createdAt: DateTimeFilter
  """最後に直した時刻（entries の列）で絞る"""
  updatedAt: DateTimeFilter
  """公開した時刻（entries の列）で絞る。未公開の entry は NULL なのでどの条件にも合わない"""
  publishedAt: DateTimeFilter
}

"""システムの日時の範囲。書いた物は全部に合う（AND）。値は ISO 8601（"2026-09-09T00:00:00Z" / "2026-09-09"）。読めない値は何にも合わない"""
input DateTimeFilter {
  gt: String
  gte: String
  lt: String
  lte: String
}

"""フィールド 1 つの条件。value の型は op と kind で決まる（EQ は kind の型、IN は文字列の配列、GT 〜 LTE は数値か日時の文字列、IS_NULL は真偽値、ARRAY_CONTAINS は文字列）"""
input EntryFieldCondition {
  apiId: String!
  op: FieldConditionOp!
  value: JSON
}

enum FieldConditionOp {
  EQ
  IN
  """大文字小文字を区別しない部分一致（文字列だけ）"""
  CONTAINS
  """大文字小文字を区別しない前方一致（文字列だけ）"""
  STARTS_WITH
  GT
  GTE
  LT
  LTE
  """true なら値が無い物、false なら値がある物"""
  IS_NULL
  """配列のフィールドがこの値を含む"""
  ARRAY_CONTAINS
}

"""並び順。field は id / publishedAt / updatedAt / createdAt かフィールドの apiId（配列でない物）"""
input EntryOrderBy {
  field: String!
  direction: SortDirection!
}

enum SortDirection {
  ASC
  DESC
}

"""content type の種別"""
enum TypeKind {
  """entry を何件でも持つ"""
  COLLECTION
  """entry を 1 件だけ持つ（サイト設定など）"""
  SINGLETON
}

"""フィールドの種類"""
enum FieldKind {
  TEXT
  TEXT_AREA
  """URL に使う識別子。sourceField から自動生成し、型の中で一意"""
  SLUG
  NUMBER
  BOOLEAN
  """決まった選択肢から。config.options。many: true なら複数選べる（値は選択肢の配列）"""
  SELECT
  """他の entry への参照。targetTypeId が参照先の型"""
  REFERENCE
  """子フィールドを持つ入れ子。値は子の apiId → 値のオブジェクト"""
  OBJECT
  """複数の OBJECT（variant）から選んで並べる。常に配列。値は { blockType: <variant の apiId>, ... } の並び"""
  BLOCKS
  """画像やファイル。値は asset の id（createUploadUrl で作った物）。コンテンツ API では Asset に展開する"""
  ASSET
  """構造化した本文。値は ProseMirror の doc（{ type: "doc", content: [...] }）。配列にできない。コンテンツ API では json / html / text"""
  RICH_TEXT
  """日時。保存する値は UTC の ISO 8601 ちょうど 1 通り（"2026-09-09T00:00:00Z"。秒まで必須・ミリ秒なし・オフセット付きは断る）。
  絞り込みの引数は日付だけ（"2026-09-09"）やオフセット付きでも読む。コンテンツ API では _eq / _gt / _gte / _lt / _lte で絞れ、並び替えできる"""
  DATE
  """日付だけ。値は "2026-09-09" ちょうど 1 通り（時刻付きは断る）。時刻を持たないので読む側のタイムゾーンで日がずれない。
  誕生日・発行日・締切のような「その日」を指す物に使う。コンテンツ API では _eq / _gt / _gte / _lt / _lte で絞れ、並び替えできる"""
  DATE_ONLY
}

"""content type。apiId がコンテンツ API のクエリ名の元になる"""
type ContentType {
  id: ID!
  """lowerCamel の識別子（"blogs"）"""
  apiId: String!
  kind: TypeKind!
  """管理画面に出す名前"""
  name: String!
  """コンテンツ API の型名（"Blog"）"""
  singular: String!
  """コンテンツ API の一覧クエリ名（"blogs"）"""
  plural: String!
  """管理画面のプレビューが開く URL。{id} を entry の id に置き換える"""
  previewUrl: String
  """本文のコンテンツへのリンクが、サイト上でどの path になるかの型紙（`/blog/{slug}`）。
  使える印は {id} と {slug} の 2 つで、{slug} は値が無ければ id に落ちる。
  / か http(s):// で始める。空なら本文の HTML は `#entry:{id}` を出す（サイトが data-entry-id を見て置き換える）"""
  linkPath: String
  """管理画面のサイドバーに出すアイコンの識別子（"book" / "tag"）。絵柄は管理画面が決める。
  英小文字・数字・- を 32 文字まで（先頭は英小文字）。省いて作れば kind ごとの既定（COLLECTION は list、SINGLETON は file）"""
  icon: String!
  """最上位のフィールド。position 順。子は children"""
  fields: [FieldDef!]!
  createdAt: String!
  updatedAt: String!
}

"""フィールドの定義"""
type FieldDef {
  id: ID!
  apiId: String!
  name: String!
  kind: FieldKind!
  """配列か"""
  many: Boolean!
  """公開時に値が要るか"""
  required: Boolean!
  """型の中で値が一意か"""
  unique: Boolean!
  """言語ごとに値を持つか"""
  localized: Boolean!
  """REFERENCE の参照先の型"""
  targetTypeId: ID
  """OBJECT / BLOCKS の子なら親のフィールド"""
  parentFieldId: ID
  """OBJECT の子フィールド、BLOCKS の variant。position 順"""
  children: [FieldDef!]!
  config: FieldConfig!
  """兄弟の中の並び順"""
  position: Int!
}

"""kind ごとの設定。使わない項目は null"""
type FieldConfig {
  """TEXT / TEXT_AREA / SLUG の最大文字数"""
  maxLength: Int
  """SLUG の元にするフィールドの apiId"""
  sourceField: String
  """NUMBER の下限"""
  min: Float
  """NUMBER の上限"""
  max: Float
  """NUMBER を整数に限るか"""
  integer: Boolean
  """SELECT の選択肢。UPPER_SNAKE"""
  options: [String!]
}

input ContentTypeInput {
  apiId: String!
  kind: TypeKind = COLLECTION
  name: String!
  """省くと apiId から導く"""
  singular: String
  """省くと apiId から導く"""
  plural: String
  previewUrl: String
  """サイト上の path の型紙（`/blog/{slug}`）。{id} と {slug} が使える"""
  linkPath: String
  """省くと kind ごとの既定（COLLECTION は list、SINGLETON は file）"""
  icon: String
}

"""触らない項目は省く"""
input ContentTypePatch {
  name: String
  singular: String
  plural: String
  previewUrl: String
  """サイト上の path の型紙（`/blog/{slug}`）。空にすると型紙なしに戻る"""
  linkPath: String
  """サイドバーのアイコンの識別子。何度でも選び直せる"""
  icon: String
}

input FieldInput {
  apiId: String!
  name: String!
  kind: FieldKind!
  many: Boolean = false
  required: Boolean = false
  unique: Boolean = false
  localized: Boolean = false
  """REFERENCE の参照先の型"""
  targetTypeId: ID
  """OBJECT / BLOCKS の子として足すなら親のフィールド"""
  parentFieldId: ID
  config: FieldConfigInput
}

"""触らない項目は省く。config は丸ごと置き換える"""
input FieldPatch {
  name: String
  required: Boolean
  unique: Boolean
  localized: Boolean
  config: FieldConfigInput
}

input FieldConfigInput {
  maxLength: Int
  sourceField: String
  min: Float
  max: Float
  integer: Boolean
  options: [String!]
}
