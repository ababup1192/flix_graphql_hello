"""任意の JSON 値。entry の中身（フィールドの apiId → 値）に使う"""
scalar JSON

"""管理 API。content type とフィールドの定義と、entry を読み書きする。形は固定で、コンテンツ API は定義から実行時に組む"""
type Query {
  """全 content type。apiId 順"""
  contentTypes: [ContentType!]!
  """id か apiId で 1 つ。無ければ null"""
  contentType(id: ID, apiId: String): ContentType
  """型の entry の一覧。更新が新しい順。search は下書きの中身に含む文字列"""
  entries(typeId: ID!, search: String, first: Int = 50, skip: Int = 0): EntryPage!
  """entry 1 つ。無ければ null"""
  entry(id: ID!): Entry
  """asset の一覧。新しい順。アップロード途中（PENDING）の物も出る"""
  assets(first: Int = 50, skip: Int = 0): AssetPage!
  """asset 1 つ。無ければ null"""
  asset(id: ID!): Asset
}

type Mutation {
  createContentType(input: ContentTypeInput!): ContentType!
  updateContentType(id: ID!, input: ContentTypePatch!): ContentType!
  """フィールドごと消す"""
  deleteContentType(id: ID!): ID!
  """末尾に足す"""
  addField(typeId: ID!, input: FieldInput!): FieldDef!
  updateField(id: ID!, input: FieldPatch!): FieldDef!
  removeField(id: ID!): ID!
  """ids の順に並べ直す。型の全フィールドを過不足なく渡す"""
  reorderFields(typeId: ID!, ids: [ID!]!): ContentType!

  """下書きを作る。id を渡せば（移行用）それを使い、無ければ振る。fields は apiId → 値"""
  createEntry(typeId: ID!, fields: JSON!, id: ID): Entry!
  """下書きを直す。fields のキーだけ上書きし、null で消す。expectedVersion が今の version と違えば CONFLICT"""
  updateEntry(id: ID!, fields: JSON!, expectedVersion: Int!): Entry!
  """ゴミ箱へ（soft delete）。公開中なら公開も取り下げる"""
  deleteEntry(id: ID!): ID!
  """下書きを公開する。required と unique と参照先の公開はここで検査する。公開中なら公開側を下書きで上書きする。
  withDependencies なら未公開の参照先を先に公開する"""
  publishEntry(id: ID!, withDependencies: Boolean = false): Entry!
  """公開を取り下げる。下書きは残る"""
  unpublishEntry(id: ID!): Entry!
  """今の下書きを版として残す"""
  saveVersion(id: ID!): EntryVersion!
  """版の中身を下書きに戻す。expectedVersion は updateEntry と同じ"""
  restoreVersion(id: ID!, versionId: ID!, expectedVersion: Int!): Entry!

  """asset の置き先（署名付き PUT URL）を発行する。ブラウザが Content-Type / Content-Length を宣言どおりにして PUT し、
  終わったら confirmAsset を呼ぶ。URL は expiresInSeconds で切れる"""
  createUploadUrl(input: UploadInput!): Upload!
  """置いた事をストレージで確かめて READY にする。画像なら寸法を渡す。置かれていなければエラー"""
  confirmAsset(id: ID!, input: AssetConfirmInput): Asset!
  """alt を変える。ファイルの差し替えは新しい asset を作る"""
  updateAsset(id: ID!, input: AssetPatch!): Asset!
  """消す。entry（下書き・公開・richText の画像を含む）が使っていればエラー"""
  deleteAsset(id: ID!): ID!
}

"""asset の状態"""
enum AssetStatus {
  """URL を出したが、まだ置かれた事を確かめていない"""
  PENDING
  """置かれ、confirmAsset が確かめた"""
  READY
}

"""画像やファイル。中身はストレージにあり、url で配信する"""
type Asset {
  id: ID!
  """配信 URL"""
  url: String!
  fileName: String!
  mime: String!
  """バイト数"""
  size: Int!
  """画像の幅。画像でなければ null"""
  width: Int
  height: Int
  alt: String!
  status: AssetStatus!
  createdAt: String!
}

"""asset の一覧の 1 ページ"""
type AssetPage {
  nodes: [Asset!]!
  totalCount: Int!
}

"""署名付き URL の発行結果"""
type Upload {
  asset: Asset!
  """ここへ PUT する"""
  uploadUrl: String!
  """URL の有効期限（秒）"""
  expiresInSeconds: Int!
}

input UploadInput {
  fileName: String!
  """image/png などの許可リストにある物"""
  mime: String!
  """バイト数。20 MB まで"""
  size: Int!
}

input AssetConfirmInput {
  width: Int
  height: Int
  alt: String
}

input AssetPatch {
  alt: String!
}

"""entry の状態"""
enum EntryStage {
  """まだ公開していない"""
  DRAFT
  """公開中で、下書きは公開した物と同じ"""
  PUBLISHED
  """公開中で、公開後に下書きが進んでいる（再公開で反映）"""
  CHANGED
}

"""entry。fields は下書きの中身"""
type Entry {
  id: ID!
  typeId: ID!
  """楽観ロックの版。updateEntry に expectedVersion として渡す"""
  version: Int!
  stage: EntryStage!
  fields: JSON!
  publishedAt: String
  createdAt: String!
  updatedAt: String!
  """版。新しい順。公開時と saveVersion で積む"""
  versions: [EntryVersion!]!
}

"""版を積んだ理由"""
enum VersionReason {
  PUBLISH
  SAVE
}

"""entry の版"""
type EntryVersion {
  id: ID!
  """積んだ時点の entry の version"""
  version: Int!
  reason: VersionReason!
  author: String!
  fields: JSON!
  createdAt: String!
}

"""entry の一覧の 1 ページ"""
type EntryPage {
  nodes: [Entry!]!
  totalCount: Int!
}

"""content type の種別"""
enum TypeKind {
  """entry を何件でも持つ"""
  COLLECTION
  """entry を 1 件だけ持つ（サイト設定など）"""
  SINGLETON
}

"""フィールドの種類"""
enum FieldKind {
  TEXT
  TEXT_AREA
  """URL に使う識別子。sourceField から自動生成し、型の中で一意"""
  SLUG
  NUMBER
  BOOLEAN
  """決まった選択肢から 1 つ。config.options"""
  SELECT
  """他の entry への参照。targetTypeId が参照先の型"""
  REFERENCE
  """子フィールドを持つ入れ子。値は子の apiId → 値のオブジェクト"""
  OBJECT
  """複数の OBJECT（variant）から選んで並べる。常に配列。値は { blockType: <variant の apiId>, ... } の並び"""
  BLOCKS
  """画像やファイル。値は asset の id（createUploadUrl で作った物）。コンテンツ API では Asset に展開する"""
  ASSET
  """構造化した本文。値は ProseMirror の doc（{ type: "doc", content: [...] }）。配列にできない。コンテンツ API では json / html / text"""
  RICH_TEXT
}

"""content type。apiId がコンテンツ API のクエリ名の元になる"""
type ContentType {
  id: ID!
  """lowerCamel の識別子（"blogs"）"""
  apiId: String!
  kind: TypeKind!
  """管理画面に出す名前"""
  name: String!
  """コンテンツ API の型名（"Blog"）"""
  singular: String!
  """コンテンツ API の一覧クエリ名（"blogs"）"""
  plural: String!
  """管理画面のプレビューが開く URL。{id} を entry の id に置き換える"""
  previewUrl: String
  """最上位のフィールド。position 順。子は children"""
  fields: [FieldDef!]!
  createdAt: String!
  updatedAt: String!
}

"""フィールドの定義"""
type FieldDef {
  id: ID!
  apiId: String!
  name: String!
  kind: FieldKind!
  """配列か"""
  many: Boolean!
  """公開時に値が要るか"""
  required: Boolean!
  """型の中で値が一意か"""
  unique: Boolean!
  """言語ごとに値を持つか"""
  localized: Boolean!
  """REFERENCE の参照先の型"""
  targetTypeId: ID
  """OBJECT / BLOCKS の子なら親のフィールド"""
  parentFieldId: ID
  """OBJECT の子フィールド、BLOCKS の variant。position 順"""
  children: [FieldDef!]!
  config: FieldConfig!
  """兄弟の中の並び順"""
  position: Int!
}

"""kind ごとの設定。使わない項目は null"""
type FieldConfig {
  """TEXT / TEXT_AREA / SLUG の最大文字数"""
  maxLength: Int
  """SLUG の元にするフィールドの apiId"""
  sourceField: String
  """NUMBER の下限"""
  min: Float
  """NUMBER の上限"""
  max: Float
  """NUMBER を整数に限るか"""
  integer: Boolean
  """SELECT の選択肢。UPPER_SNAKE"""
  options: [String!]
}

input ContentTypeInput {
  apiId: String!
  kind: TypeKind = COLLECTION
  name: String!
  """省くと apiId から導く"""
  singular: String
  """省くと apiId から導く"""
  plural: String
  previewUrl: String
}

"""触らない項目は省く"""
input ContentTypePatch {
  name: String
  singular: String
  plural: String
  previewUrl: String
}

input FieldInput {
  apiId: String!
  name: String!
  kind: FieldKind!
  many: Boolean = false
  required: Boolean = false
  unique: Boolean = false
  localized: Boolean = false
  """REFERENCE の参照先の型"""
  targetTypeId: ID
  """OBJECT / BLOCKS の子として足すなら親のフィールド"""
  parentFieldId: ID
  config: FieldConfigInput
}

"""触らない項目は省く。config は丸ごと置き換える"""
input FieldPatch {
  name: String
  required: Boolean
  unique: Boolean
  localized: Boolean
  config: FieldConfigInput
}

input FieldConfigInput {
  maxLength: Int
  sourceField: String
  min: Float
  max: Float
  integer: Boolean
  options: [String!]
}
