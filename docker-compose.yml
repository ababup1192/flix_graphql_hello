# 開発と test-pg 用の PostgreSQL と MinIO（S3 互換。本番の R2 と同じ API）。
# `make db-up` で起動し、`make run` / `make test-pg` が接続する。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cms
      MINIO_ROOT_PASSWORD: cms-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 15

  # バケット `cms` を作り、匿名の読み取りを許す（配信 URL を署名無しで開けるように）。1 回走って終わる
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cms cms-secret &&
      mc mb --ignore-existing local/cms &&
      mc anonymous set download local/cms
      "
